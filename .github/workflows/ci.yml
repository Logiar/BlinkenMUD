name: C CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile project
        run: make -C src CC=${{ matrix.compiler }} clean all EXTRA_C_FLAGS='-Werror'

      - name: Run make test target
        run: make -C src CC=${{ matrix.compiler }} test EXTRA_C_FLAGS='-Werror'

      - name: Run integration bot smoke test
        run: python3 bot/integration_test_bot.py --port 19000

  sanitizer-checks:
    name: Sanitizer checks (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: |
          make -C src clean all \
            EXTRA_C_FLAGS='-Werror -fsanitize=address,undefined -fno-omit-frame-pointer' \
            L_FLAGS='-fsanitize=address,undefined'

      - name: Run unit tests with sanitizers
        run: |
          make -C src unit-tests \
            EXTRA_C_FLAGS='-Werror -fsanitize=address,undefined -fno-omit-frame-pointer' \
            L_FLAGS='-fsanitize=address,undefined'

      - name: Run integration bot with sanitizers
        run: python3 bot/integration_test_bot.py --port 19001 --sweep-duration 90
